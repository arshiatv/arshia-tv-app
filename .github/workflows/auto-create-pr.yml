name: Auto-create PR

on:
  push:
    branches:
      - 'feature/force-update-realtime-auth-gate'

permissions:
  contents: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR via GitHub API
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            // github-script injects `github` and `context`; avoid redeclaring core/other injected globals
            const body = fs.existsSync('PR_NOTES.md') ? fs.readFileSync('PR_NOTES.md','utf8') : 'Automatic PR for feature branch';
            const { data } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'feat: Force update + Admin-managed content',
              head: 'feature/force-update-realtime-auth-gate',
              base: 'main',
              body,
            });
            console.log(`PR created: ${data.html_url}`);
